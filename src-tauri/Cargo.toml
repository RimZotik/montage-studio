[package]
name = "montage-studio"
version = "0.1.0"
description = "Video editing studio with Claude Code"
edition = "2024"
publish = false

[lib]
name = "montage_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
log = "0.4"
# SQLite внутри программы (без установки на ПК): указатель проектов, учет, позже инструменты и память.
rusqlite = { version = "0.41", features = ["bundled"] }
sysinfo = "0.40"
which = "8"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
