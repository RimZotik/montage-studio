[package]
name = "montage-studio"
version = "0.7.0"
description = "Video editing studio with Claude Code"
edition = "2024"
publish = false

[lib]
name = "montage_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
log = "0.4"
# SQLite внутри программы (без установки на ПК): указатель проектов, учет, позже инструменты и память.
rusqlite = { version = "0.41", features = ["bundled"] }
sysinfo = "0.40"
which = "8"
# MCP-сервер студии для Claude (HTTP на 127.0.0.1).
tiny_http = "0.12"
# Загрузка компонентов: TLS на ring (aws-lc-rs требует cmake/NASM при сборке).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.11"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["protocol-asset", "test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
